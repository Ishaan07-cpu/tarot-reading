<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — Ek Raaz Ki Baat Batau?</title>
  <meta name="description" content="Verify your email address to activate your Ek Raaz Ki Baat Batau? account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .form-msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .form-msg.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; }
    .form-msg.success { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.4); color: #6ee7b7; }
    .form-msg.info    { background: rgba(212,168,83,0.15); border: 1px solid rgba(212,168,83,0.4); color: var(--gold-light); }

    .otp-inputs {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .otp-digit {
      width: 48px;
      height: 58px;
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      font-family: var(--font-serif);
      color: var(--gold-light);
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: var(--gold);
    }
    .otp-digit:focus {
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(212,168,83,0.3);
    }
    .otp-digit.filled {
      border-color: rgba(212,168,83,0.6);
      background: rgba(212,168,83,0.07);
    }
    .email-hint {
      font-size: 0.9rem;
      color: var(--white-dim);
      text-align: center;
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }
    .email-hint strong { color: var(--gold-light); word-break: break-all; }
    .inbox-note {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.55);
      text-align: center;
      margin-top: 0.2rem;
      margin-bottom: 1.2rem;
    }

    .resend-row {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.82rem;
      color: var(--white-dim);
    }
    .resend-row button {
      background: none;
      border: none;
      color: var(--gold-light);
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.82rem;
      padding: 0;
    }
    .resend-row button:disabled { color: var(--gold-dim); cursor: not-allowed; }
    #countdown { color: var(--gold-dim); }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>
  <a href="index.html" class="back-link">← Back to Home</a>

  <div class="auth-page">
    <div class="auth-container reveal">
      <div class="auth-logo">📬</div>
      <h1 class="auth-title">Check Your Inbox</h1>
      <p class="auth-subtitle">We sent a 6-digit cosmic verification code to your email.</p>

      <form id="otpForm" novalidate>
        <p class="email-hint">Code sent to: <strong id="emailDisplay">your email</strong></p>
        <p class="inbox-note">Please check your inbox (or spam / promotions folder if not seen within a minute).</p>

        <div class="otp-inputs" id="otpInputs">
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" id="d1" autocomplete="off" />
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" id="d2" autocomplete="off" />
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" id="d3" autocomplete="off" />
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" id="d4" autocomplete="off" />
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" id="d5" autocomplete="off" />
          <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" id="d6" autocomplete="off" />
        </div>

        <button type="submit" class="btn-submit" id="verifyBtn">Verify &amp; Activate Account</button>
      </form>

      <div class="resend-row">
        Didn't receive it? &nbsp;
        <button id="resendBtn" type="button" disabled>Resend Code (<span id="countdown">60</span>s)</button>
      </div>

      <div class="auth-divider"><span>or</span></div>
      <p class="auth-footer">Already verified? <a href="login.html">Login here ✦</a></p>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    const digits = Array.from(document.querySelectorAll('.otp-digit'));
    const otpForm = document.getElementById('otpForm');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');
    const emailDisplay = document.getElementById('emailDisplay');

    const pendingEmail = sessionStorage.getItem('pending_otp_email') || '';
    if (pendingEmail) {
      emailDisplay.textContent = pendingEmail;
    } else {
      window.location.href = 'signup.html';
    }

    function fillCode(str) {
      digits.forEach((inp, idx) => {
        inp.value = str[idx] || '';
        inp.classList.toggle('filled', !!inp.value);
      });
      digits[5].focus();
    }

    // ── OTP digit input behaviour ───────────────────────────────
    digits.forEach((d, i) => {
      d.addEventListener('input', e => {
        const val = e.target.value.replace(/\D/g, '');
        d.value = val ? val[0] : '';
        d.classList.toggle('filled', !!d.value);
        if (d.value && i < digits.length - 1) digits[i + 1].focus();
        tryAutoSubmit();
      });
      d.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !d.value && i > 0) {
          digits[i - 1].value = '';
          digits[i - 1].classList.remove('filled');
          digits[i - 1].focus();
        }
        if (e.key === 'ArrowLeft' && i > 0) digits[i - 1].focus();
        if (e.key === 'ArrowRight' && i < digits.length - 1) digits[i + 1].focus();
      });
      d.addEventListener('paste', e => {
        const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
        if (pasted.length === 6) {
          e.preventDefault();
          fillCode(pasted);
          tryAutoSubmit();
        }
      });
    });
    digits[0].focus();

    function getOtp() { return digits.map(d => d.value).join(''); }

    function tryAutoSubmit() {
      if (getOtp().length === 6) otpForm.requestSubmit();
    }

    // ── Form submit ─────────────────────────────────────────────
    otpForm.addEventListener('submit', async e => {
      e.preventDefault();
      const otp = getOtp();
      if (otp.length < 6) return showMsg('error', 'Please enter the full 6-digit verification code.');

      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying with the Cosmos…';

      try {
        const res = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, otp }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('tarot_token', data.token);
          localStorage.setItem('tarot_user', JSON.stringify(data.user));
          sessionStorage.removeItem('pending_otp_email');
          showMsg('success', `✦ Account verified! Welcome, ${data.user.name}. Redirecting…`);
          setTimeout(() => { window.location.href = 'profile.html'; }, 1200);
        } else {
          showMsg('error', data.message || 'Invalid or expired code. Please try again.');
          digits.forEach(d => { d.value = ''; d.classList.remove('filled'); });
          digits[0].focus();
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify & Activate Account';
        }
      } catch (err) {
        showMsg('error', 'Could not reach server. Please ensure backend is running.');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify & Activate Account';
      }
    });

    // ── Resend OTP with countdown ───────────────────────────────
    let timer;
    function startCountdown(sec = 60) {
      resendBtn.disabled = true;
      let s = sec;
      document.getElementById('countdown').textContent = s;
      clearInterval(timer);
      timer = setInterval(() => {
        s--;
        document.getElementById('countdown').textContent = s;
        if (s <= 0) {
          clearInterval(timer);
          resendBtn.disabled = false;
          resendBtn.textContent = 'Resend Code';
        }
      }, 1000);
    }
    startCountdown();

    resendBtn.addEventListener('click', async () => {
      resendBtn.disabled = true;
      resendBtn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/auth/resend-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showMsg('success', data.message || 'A fresh code has been sent to your email.');
          resendBtn.textContent = 'Resend Code (60s)';
          startCountdown();
        } else {
          showMsg('error', data.message || 'Could not resend verification code.');
          resendBtn.disabled = false;
          resendBtn.textContent = 'Resend Code';
        }
      } catch {
        showMsg('error', 'Could not reach server to resend code.');
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend Code';
      }
    });

    // ── Message Helper ──────────────────────────────────────────
    function showMsg(type, msg) {
      document.querySelectorAll('.form-msg').forEach(el => el.remove());
      const div = document.createElement('div');
      div.className = `form-msg ${type}`;
      div.textContent = msg;
      otpForm.prepend(div);
      if (type === 'success') setTimeout(() => div.remove(), 4000);
    }
  </script>
</body>
</html>
