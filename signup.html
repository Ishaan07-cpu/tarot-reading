<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Ek Raaz Ki Baat Batau?</title>
  <meta name="description" content="Create your account at Ek Raaz Ki Baat Batau? and begin your tarot reading journey." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .form-msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .form-msg.error   { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; }
    .form-msg.success { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.4); color: #6ee7b7; }
    .password-wrapper { position: relative; }
    .toggle-pwd {
      position: absolute;
      right: 0.9rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--gold-dim); cursor: pointer;
      font-size: 1rem; transition: color 0.2s;
    }
    .toggle-pwd:hover { color: var(--gold-light); }
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      margin-top: 0.5rem;
      background: var(--border);
      overflow: hidden;
      transition: all 0.3s;
    }
    .strength-bar-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease, background 0.4s ease;
    }
    .strength-label {
      font-size: 0.7rem;
      color: var(--gold-dim);
      margin-top: 0.25rem;
      letter-spacing: 0.05em;
    }

    .terms-check {
      display: flex; align-items: flex-start; gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .terms-check input[type="checkbox"] {
      width: 16px; height: 16px; flex-shrink: 0;
      accent-color: var(--gold); cursor: pointer; margin-top: 2px;
    }
    .terms-check label {
      font-size: 0.8rem; color: var(--white-dim); cursor: pointer;
    }
    .terms-check label a { color: var(--gold-light); text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>

  <a href="index.html" class="back-link">← Back to Home</a>

  <div class="auth-page">
    <div class="auth-container reveal">
      <div class="auth-logo">✦</div>
      <h1 class="auth-title">Begin Your Journey</h1>
      <p class="auth-subtitle">Create your account and let the universe guide you.</p>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="signupName">Full Name</label>
          <input
            class="form-input"
            type="text"
            id="signupName"
            name="name"
            placeholder="Your name"
            autocomplete="name"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <input
            class="form-input"
            type="email"
            id="signupEmail"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <div class="password-wrapper">
            <input
              class="form-input"
              type="password"
              id="signupPassword"
              name="password"
              placeholder="Create a strong password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-pwd" id="toggleSignupPwd" aria-label="Toggle password">👁</button>
          </div>
          <div class="strength-bar">
            <div class="strength-bar-fill" id="strengthFill"></div>
          </div>
          <p class="strength-label" id="strengthLabel"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupConfirm">Confirm Password</label>
          <div class="password-wrapper">
            <input
              class="form-input"
              type="password"
              id="signupConfirm"
              name="confirm"
              placeholder="Repeat your password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-pwd" id="toggleConfirmPwd" aria-label="Toggle confirm password">👁</button>
          </div>
        </div>
        <div class="form-group">
          <div class="terms-check">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
            <label for="agreeTerms">
              I agree to the <a href="#">Terms of Service</a> and understand that my readings are for spiritual guidance only.
            </label>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="signupSubmitBtn">Create My Account</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <p class="auth-footer">Already have an account? <a href="login.html">Login here ✦</a></p>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // Toggle password visibility
    function togglePwd(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const inp = document.getElementById(inputId);
      if (!btn || !inp) return;
      btn.addEventListener('click', () => {
        const hidden = inp.type === 'password';
        inp.type = hidden ? 'text' : 'password';
        btn.textContent = hidden ? '🙈' : '👁';
      });
    }
    togglePwd('toggleSignupPwd', 'signupPassword');
    togglePwd('toggleConfirmPwd', 'signupConfirm');

    // Password strength meter
    const pwdInput    = document.getElementById('signupPassword');
    const strengthBar = document.getElementById('strengthFill');
    const strengthLbl = document.getElementById('strengthLabel');
    if (pwdInput) {
      pwdInput.addEventListener('input', () => {
        const val = pwdInput.value;
        let score = 0;
        if (val.length >= 6)  score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const levels = [
          { pct: 0,   color: 'transparent', label: '' },
          { pct: 20,  color: '#ef4444',      label: 'Very Weak' },
          { pct: 40,  color: '#f97316',      label: 'Weak' },
          { pct: 60,  color: '#eab308',      label: 'Fair' },
          { pct: 80,  color: '#22c55e',      label: 'Strong' },
          { pct: 100, color: '#d4a853',      label: 'Cosmic Strength ✦' },
        ];
        const lvl = levels[Math.min(score, 5)];
        strengthBar.style.width    = lvl.pct + '%';
        strengthBar.style.background = lvl.color;
        strengthLbl.textContent    = lvl.label;
        strengthLbl.style.color    = lvl.color;
      });
    }

    // Override form to check terms checkbox
    const form = document.getElementById('signupForm');
    const origSubmit = form.onsubmit;
    form.addEventListener('submit', e => {
      const terms = document.getElementById('agreeTerms');
      if (terms && !terms.checked) {
        e.stopImmediatePropagation();
        e.preventDefault();
        const div = document.createElement('div');
        div.className = 'form-msg error';
        div.textContent = 'Please accept the terms to continue.';
        if (!form.querySelector('.form-msg')) form.prepend(div);
        setTimeout(() => div.remove(), 4000);
      }
    }, true);
  </script>
</body>
</html>
